<!DOCTYPE html>
<html>
  <head>
    <title>Floor Plan</title>
    <link rel="stylesheet" href="Styles/tokens.css">
    <link rel="stylesheet" href="Styles/RedesignSICC.css">
    <link rel="stylesheet" href="Styles/Level.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="Icon" type="Icon/png" href="Icon/Frame 1.webp">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  </head>

  <body>
    <div class="page-container">
      <nav class="navbar">
          <div class="nav-logo">
              <img src="Icon/LOGO.webp" alt="SICC Logo">
          </div>
          <ul class="nav-links">
              <li><a href="index.html#hero">Home</a></li>
              <li><a href="index.html#exhibition">Exhibitions</a></li>
              <li><a href="index.html#visit">Visit</a></li>  
              <li><a href="index.html#venues">Venues</a></li>
          </ul>
          <div class="nav-search">
              <input type="text" placeholder="Search...">
          </div>
      </nav>
    </div>

    <div class="floor-navigator">
        <div class="btn-group">
            <a href="Level2.html">
                <button class="lvl-btn" data-lvl="2">L2</button>
            </a>

            <a href="Level3.html">
                <button class="lvl-btn active" data-lvl="3">L3</button>
            </a>
            
            <a href="Level4.html">
                <button class="lvl-btn" data-lvl="4">L4</button>
            </a>
            
            <a href="Level5.html">
                <button class="lvl-btn" data-lvl="5">L5</button>
            </a>
        </div>
    </div>

    <section class="venue-showcase">
        <div class="venue-row">
            <div class="venue-image">
                <img src="image/Jesselton Square.webp" alt="Jesselton Square">
            </div>
            <div class="venue-content">
                <span class="venue-tag">Jesselton Square</span>
                <h2>Jesselton Square</h2>
                <div class="venue-detail-box">
                    <p>SICC's premier open-concept plaza. A versatile outdoor venue designed for grand exhibitions, cultural festivals, and large-scale public automotive launches</p>
                    <div class="capacity-grid">
                        <div class="cap-node"><span>Theater</span><b>6,000</b></div>
                        <div class="cap-node"><span>Banquet</span><b>3,500</b></div>
                        <div class="cap-node"><span>Area</span><b>5,007.45m²</b></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        function switchFloor(lvl) {
            console.log(`Current Floor: Level ${lvl}`);
        }

        const floorButtons = document.querySelectorAll('.lvl-btn');

        floorButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const level = btn.getAttribute('data-lvl');
                
                const routes = {
                    "2": "KinabaluHall.html",
                    "3": "Level3.html",
                    "4": "SipadanHall.html",
                    "5": "Level5.html"
                };

                if (routes[level]) {
                    window.location.href = routes[level];
                }
            });
        });
    </script>
  </body>
</html>
